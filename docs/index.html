<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Libreta de Prácticas · Enfermería UniNorte</title>
  <meta name="theme-color" content="#4B5320">
  <meta name="description" content="Plataforma Académica de la Carrera de Enfermería (UniNorte): Libreta Digital de Prácticas, calendario, documentos y avisos.">
  <link rel="icon" type="image/png" href="assets/logo-enfermeria.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css?v=3">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('tema'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
      document.documentElement.setAttribute('data-tema', t);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>Esta plataforma necesita JavaScript activado.</noscript>
  <script src="assets/demo.js?v=2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es" data-tema="claro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Libreta de Prácticas · Enfermería UniNorte</title>
  <meta name="theme-color" content="#4B5320">
  <meta name="description" content="Plataforma Académica de la Carrera de Enfermería (UniNorte): Libreta Digital de Prácticas, calendario, documentos y avisos.">
  <link rel="icon" type="image/png" href="assets/logo-enfermeria.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/app.css?v=2">
  <style>
    .demo-banda { background: #E9B949; color: #2B2205; font-size: .8rem; font-weight: 700; text-align: center; padding: 6px 12px; }
    .demo-banda button { background: none; border: 0; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; padding: 0 4px; }
    .cuentas-demo { display: grid; gap: 8px; margin-top: 16px; }
    .cuenta-demo { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; border-radius: 12px;
      border: 1.5px dashed var(--borde); background: var(--superficie-2); color: var(--texto); font: inherit; cursor: pointer; }
    .cuenta-demo:hover { border-color: var(--musgo); }
    .cuenta-demo small { display: block; }
  </style>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('tema'); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
      document.documentElement.setAttribute('data-tema', t);
    })();
  </script>
</head>
<body>
  <div id="app"></div>
  <noscript>Esta plataforma necesita JavaScript activado.</noscript>
  <script src="assets/demo.js?v=1"></script>
</body>
</html>
